<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 64 64" xml:space="preserve">
  <!-- Crabtopia emblem: flat gold crab on deep-sea teal, clean sheet style -->
  <circle cx="32" cy="32" r="30" fill="#0E7CA8"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#0A5C7E" stroke-width="2"/>
  <!-- legs -->
  <g stroke="#E07B39" stroke-width="3" stroke-linecap="round">
    <path d="M20 44 L13 50" fill="none"/>
    <path d="M24 47 L19 54" fill="none"/>
    <path d="M44 44 L51 50" fill="none"/>
    <path d="M40 47 L45 54" fill="none"/>
  </g>
  <!-- claws -->
  <g fill="#FB8500">
    <path d="M14 26 a8 8 0 1 1 8 8 a6.5 6.5 0 1 0 -8 -8 Z"/>
    <path d="M50 26 a8 8 0 1 0 -8 8 a6.5 6.5 0 1 1 8 -8 Z"/>
  </g>
  <!-- eye stalks -->
  <g stroke="#E07B39" stroke-width="3" stroke-linecap="round">
    <path d="M27 26 L25 19" fill="none"/>
    <path d="M37 26 L39 19" fill="none"/>
  </g>
  <circle cx="25" cy="17" r="3.4" fill="#FFFFFF"/>
  <circle cx="39" cy="17" r="3.4" fill="#FFFFFF"/>
  <circle cx="25" cy="17" r="1.7" fill="#22303A"/>
  <circle cx="39" cy="17" r="1.7" fill="#22303A"/>
  <!-- body -->
  <ellipse cx="32" cy="38" rx="15" ry="10.5" fill="#FFB703"/>
  <ellipse cx="32" cy="38" rx="15" ry="10.5" fill="none" stroke="#E07B39" stroke-width="2"/>
  <path d="M24 42 q2.5 2.4 5 0 M29.5 43.5 q2.5 2.4 5 0 M35 42 q2.5 2.4 5 0" fill="none" stroke="#E07B39" stroke-width="1.6" stroke-linecap="round"/>
</svg>
